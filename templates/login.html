{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg">
            <div class="card-header bg-success text-white text-center py-3">
                <i class="fas fa-school fa-3x mb-2"></i>
                <h3 class="mb-0">TK RA SA'DIAH</h3>
                <p class="mb-0">Sistem Informasi Sekolah</p>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-user"></i> Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Masukkan username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Masukkan password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-user-tag"></i> Login Sebagai</label>
                        <select name="role" class="form-control" required>
                            <option value="">Pilih Role</option>
                            <option value="admin">👑 Admin</option>
                            <option value="guru">👩‍🏫 Guru</option>
                            <option value="murid">👧 Murid</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>
                <hr>
                <div class="text-center">
                    <a href="{{ url_for('auth.lupa_password') }}" class="text-muted">
                        <i class="fas fa-key"></i> Lupa Password?
                    </a>
                </div>
            </div>
            <div class="card-footer text-center text-muted py-3">
                <small>© 2024 TK RA SA'DIAH</small>
            </div>
        </div>
    </div>
</div>

<style>
    .card {
        background: rgba(255,255,255,0.98);
        border: none;
    }
    .form-control:focus {
        border-color: #2e7d32;
        box-shadow: 0 0 0 0.2rem rgba(46,125,50,0.25);
    }
</style>
{% endblock %}
