{% extends "base.html" %}

{% block title %}Lupa Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg">
            <div class="card-header bg-warning text-white text-center py-3">
                <i class="fas fa-key fa-3x mb-2"></i>
                <h3 class="mb-0">Lupa Password</h3>
                <p class="mb-0">Reset password akun Anda</p>
            </div>
            <div class="card-body p-4">
                <p class="text-muted mb-4">
                    Masukkan username Anda. Kami akan mengirimkan link reset password.
                </p>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-user"></i> Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Masukkan username" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 py-2">
                        <i class="fas fa-paper-plane"></i> Kirim Link Reset
                    </button>
                </form>
                <hr>
                <div class="text-center">
                    <a href="{{ url_for('auth.login') }}" class="btn btn-link">
                        <i class="fas fa-arrow-left"></i> Kembali ke Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
