{% extends "base.html" %}

{% block title %}Edit Guru - TK RA SA'DIAH{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
                <h4><i class="fas fa-user-edit"></i> Edit Data Guru</h4>
                <p class="mb-0">Edit informasi guru</p>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-user"></i> Nama Lengkap</label>
                                <input type="text" name="full_name" class="form-control" value="{{ guru.full_name }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-at"></i> Username</label>
                                <input type="text" class="form-control" value="{{ guru.username }}" disabled>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-id-card"></i> NIP</label>
                                <input type="text" name="nip" class="form-control" value="{{ guru.nip|default('') }}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-book"></i> Mata Pelajaran</label>
                                <input type="text" name="mata_pelajaran" class="form-control" value="{{ guru.mata_pelajaran|default('') }}">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-venus-mars"></i> Jenis Kelamin</label>
                                <select name="jenis_kelamin" class="form-select">
                                    <option value="">Pilih</option>
                                    <option value="Laki-laki" {% if guru.jenis_kelamin == 'Laki-laki' %}selected{% endif %}>Laki-laki</option>
                                    <option value="Perempuan" {% if guru.jenis_kelamin == 'Perempuan' %}selected{% endif %}>Perempuan</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-calendar"></i> Tanggal Lahir</label>
                                <input type="date" name="tanggal_lahir" class="form-control" value="{{ guru.tanggal_lahir|default('') }}">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
                                <input type="email" name="email" class="form-control" value="{{ guru.email|default('') }}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-phone"></i> Telepon</label>
                                <input type="text" name="phone" class="form-control" value="{{ guru.phone|default('') }}">
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-key"></i> Password Baru <span class="text-muted">(Opsional)</span></label>
                        <input type="password" name="password" class="form-control" placeholder="Kosongkan jika tidak ingin mengganti password">
                    </div>
                    
                    <hr>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin.kelola_guru') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Kembali
                        </a>
                        <button type="submit" class="btn btn-warning">
                            <i class="fas fa-save"></i> Simpan Perubahan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
