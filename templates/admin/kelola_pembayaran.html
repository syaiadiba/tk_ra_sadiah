<!-- Form Tambah Pembayaran -->
<div class="row mb-4">
    <div class="col-12">
        <div class="card shadow-sm">
            <div class="card-header bg-info text-white">
                <h5><i class="fas fa-plus-circle"></i> Tambah Pembayaran</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('admin.tambah_pembayaran') }}" class="row g-3">
                    <div class="col-md-3">
                        <select name="nis_murid" class="form-control" required>  <!-- ← GANTI MURID_ID JADI NIS_MURID -->
                            <option value="">Pilih Siswa</option>
                            {% for s in siswa %}
                            <option value="{{ s.nis }}">{{ s.full_name }} ({{ s.nis|default('-') }})</option>  <!-- ← VALUE PAKAI NIS -->
                            {% endfor %}
                        </select>
                    </div>
                    <!-- sisanya tetap sama -->
                    <div class="col-md-2">
                        <select name="bulan" class="form-control" required>
                            <option value="">Bulan</option>
                            <option value="Januari">Januari</option>
                            <option value="Februari">Februari</option>
                            <option value="Maret">Maret</option>
                            <option value="April">April</option>
                            <option value="Mei">Mei</option>
                            <option value="Juni">Juni</option>
                            <option value="Juli">Juli</option>
                            <option value="Agustus">Agustus</option>
                            <option value="September">September</option>
                            <option value="Oktober">Oktober</option>
                            <option value="November">November</option>
                            <option value="Desember">Desember</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="number" name="tahun" class="form-control" placeholder="Tahun" value="2024" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" name="nominal" class="form-control" placeholder="Nominal" value="500000" required>
                    </div>
                    <div class="col-md-2">
                        <select name="status" class="form-control">
                            <option value="belum_bayar">Belum Bayar</option>
                            <option value="lunas">Lunas</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <button type="submit" class="btn btn-primary w-100">Tambah</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
