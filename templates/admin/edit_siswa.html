{% extends "base.html" %}

{% block title %}Edit Siswa - TK RA SA'DIAH{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
                <h4><i class="fas fa-user-edit"></i> Edit Data Siswa</h4>
                <p class="mb-0">Edit informasi siswa</p>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-user"></i> Nama Lengkap</label>
                                <input type="text" name="full_name" class="form-control" value="{{ siswa.full_name }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-at"></i> Username</label>
                                <input type="text" class="form-control" value="{{ siswa.username }}" disabled>
                                <small class="text-muted">Username tidak bisa diubah</small>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-id-card"></i> NIS</label>
                                <input type="text" name="nis" class="form-control" value="{{ siswa.nis|default('') }}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-id-card"></i> NISN</label>
                                <input type="text" name="nisn" class="form-control" value="{{ siswa.nisn|default('') }}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-school"></i> Kelas</label>
                                <select name="kelas" class="form-select">
                                    <option value="">Pilih Kelas</option>
                                    <option value="TK A" {% if siswa.kelas == 'TK A' %}selected{% endif %}>TK A</option>
                                    <option value="TK B" {% if siswa.kelas == 'TK B' %}selected{% endif %}>TK B</option>
                                    <option value="TK C" {% if siswa.kelas == 'TK C' %}selected{% endif %}>TK C</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-venus-mars"></i> Jenis Kelamin</label>
                                <select name="jenis_kelamin" class="form-select">
                                    <option value="">Pilih</option>
                                    <option value="Laki-laki" {% if siswa.jenis_kelamin == 'Laki-laki' %}selected{% endif %}>Laki-laki</option>
                                    <option value="Perempuan" {% if siswa.jenis_kelamin == 'Perempuan' %}selected{% endif %}>Perempuan</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-calendar"></i> Tanggal Lahir</label>
                                <input type="date" name="tanggal_lahir" class="form-control" value="{{ siswa.tanggal_lahir|default('') }}">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
                                <input type="email" name="email" class="form-control" value="{{ siswa.email|default('') }}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-phone"></i> Telepon</label>
                                <input type="text" name="phone" class="form-control" value="{{ siswa.phone|default('') }}">
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-map-marker-alt"></i> Alamat</label>
                        <textarea name="address" class="form-control" rows="2">{{ siswa.address|default('') }}</textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-key"></i> Password Baru <span class="text-muted">(Opsional)</span></label>
                        <input type="password" name="password" class="form-control" placeholder="Kosongkan jika tidak ingin mengganti password">
                    </div>
                    
                    <hr>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin.kelola_siswa') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Kembali
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Simpan Perubahan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
