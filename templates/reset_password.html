{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg">
            <div class="card-header bg-success text-white text-center py-3">
                <i class="fas fa-lock fa-3x mb-2"></i>
                <h3 class="mb-0">Reset Password</h3>
                <p class="mb-0">Buat password baru</p>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-key"></i> Password Baru</label>
                        <input type="password" name="new_password" class="form-control" placeholder="Masukkan password baru" required>
                        <small class="text-muted">Minimal 4 karakter</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-check-circle"></i> Konfirmasi Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Konfirmasi password baru" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="fas fa-save"></i> Reset Password
                    </button>
                </form>
                <hr>
                <div class="text-center">
                    <a href="{{ url_for('auth.login') }}" class="btn btn-link">
                        <i class="fas fa-arrow-left"></i> Kembali ke Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
